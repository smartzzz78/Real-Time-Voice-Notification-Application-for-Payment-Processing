<!DOCTYPE html>
<html class="" lang="th"><head><title>PayVox — เพิ่มเงินเข้า</title><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_tab" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/><link href="fonts/material-symbols.css?v=2" rel="stylesheet"/><link href="css/payvox.css?v=4" rel="stylesheet"/>
<style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#faf8ff;color:#131b2e;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}
@keyframes soundwave { 0%, 100% { height: 6px; } 50% { height: 22px; } }
.wave-active div:nth-child(1) { animation: soundwave 0.5s infinite ease-in-out; }
.wave-active div:nth-child(2) { animation: soundwave 0.4s infinite ease-in-out 0.1s; }
.wave-active div:nth-child(3) { animation: soundwave 0.6s infinite ease-in-out 0.2s; }
.wave-active div:nth-child(4) { animation: soundwave 0.45s infinite ease-in-out 0.15s; }
.wave-active div:nth-child(5) { animation: soundwave 0.55s infinite ease-in-out 0.05s; }
@keyframes scanMove {
  0% { top: 15%; opacity: 0.6; }
  50% { top: 80%; opacity: 1; }
  100% { top: 15%; opacity: 0.6; }
}
.scanning-active-line {
  animation: scanMove 1.6s infinite ease-in-out;
}
/* แถบปุ่มลอยเหนือแถบเมนูล่าง — กดได้เสมอ ไม่โดน nav บัง */
.action-bar {
  position: sticky;
  bottom: calc(4.25rem + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  padding-top: 0.5rem;
}
</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script src="js/theme.js?v=1"></script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body-md flex flex-col min-h-screen">
<header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.06)]"><div class="h-16 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-sm"><img alt="PayVox" class="w-10 h-10 rounded-full object-cover shadow-sm" src="icons/icon-192.png"/><div class="flex flex-col"><div class="flex items-center gap-space-xs"><span class="font-title-md text-title-md text-on-surface leading-tight">PayVox</span><div class="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-surface-container"><span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span><span class="font-label-sm text-label-sm text-primary font-semibold">ออนไลน์</span></div></div><span class="font-label-sm text-label-sm text-on-surface-variant truncate max-w-[160px]">บันทึกเงินเข้า</span></div></div><div class="flex items-center gap-space-xs"><button aria-label="ทดสอบเสียงเตือนเงินเข้า" class="w-10 h-10 rounded-full bg-surface-container hover:bg-surface-container-high flex items-center justify-center text-primary active:scale-95 transition-transform" onclick="triggerTestChime()"><span class="material-symbols-outlined text-[20px]">volume_up</span></button><img alt="" class="w-8 h-8 rounded-full object-cover ml-1" src="icons/icon-192.png"/></div></div></header>
<main class="flex flex-col relative w-full pt-16 pb-24 bg-surface flex-1"><div class="flex flex-col w-full px-margin-mobile gap-space-md">

<!-- Hero -->
<section class="flex flex-col gap-space-sm pt-space-xs">
<div class="flex items-center gap-space-xs">
<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
</div>
<h1 class="font-title-md text-title-md text-on-surface">บันทึกเงินเข้า</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
กรอกยอดเงินที่รับ ข้อมูลจะถูกบันทึกลง <strong>Google Sheets</strong> ทันที
รูปสลิปจะถูกเก็บใน <strong>Google Drive</strong> และหน้า "ตรวจสลิป" จะประกาศเสียงยอดเงินอัตโนมัติ
</p>
</section>

<!-- Form -->
<section class="flex flex-col p-space-md rounded-2xl bg-surface-container-lowest shadow-md gap-space-sm">
<form id="money-in-form" class="flex flex-col gap-space-sm">
<label class="flex flex-col gap-1.5 font-label-md text-label-md text-on-surface font-semibold">
ยอดเงิน (บาท) *
<input id="in-amount" class="w-full h-12 rounded-xl bg-surface-container-lowest border border-surface-container-high px-4 font-body-md text-on-surface outline-none focus:border-primary transition-colors" inputmode="decimal" placeholder="เช่น 150" required step="0.01" type="number"/>
</label>
<label class="flex flex-col gap-1.5 font-label-md text-label-md text-on-surface font-semibold">
ชื่อลูกค้า (ไม่ใส่ก็ได้)
<input id="in-customer" class="w-full h-12 rounded-xl bg-surface-container-lowest border border-surface-container-high px-4 font-body-md text-on-surface outline-none focus:border-primary transition-colors" placeholder="เช่น คุณกิตติศักดิ์ ร." type="text"/>
</label>
<label class="flex flex-col gap-1.5 font-label-md text-label-md text-on-surface font-semibold">
ธนาคาร / ช่องทาง (ไม่ใส่ก็ได้)
<input id="in-bank" class="w-full h-12 rounded-xl bg-surface-container-lowest border border-surface-container-high px-4 font-body-md text-on-surface outline-none focus:border-primary transition-colors" placeholder="เช่น K PLUS, SCB EASY, PromptPay" type="text"/>
</label>
<label class="flex flex-col gap-1.5 font-label-md text-label-md text-on-surface font-semibold">
รหัสอ้างอิง (ไม่ใส่ก็ได้)
<input id="in-ref" class="w-full h-12 rounded-xl bg-surface-container-lowest border border-surface-container-high px-4 font-body-md text-on-surface outline-none focus:border-primary transition-colors" placeholder="Ref บนสลิป" type="text"/>
</label>
<label class="flex flex-col gap-1.5 font-label-md text-label-md text-on-surface font-semibold">
หมายเหตุ (ไม่ใส่ก็ได้)
<input id="in-note" class="w-full h-12 rounded-xl bg-surface-container-lowest border border-surface-container-high px-4 font-body-md text-on-surface outline-none focus:border-primary transition-colors" placeholder="เช่น ลองชำ 1 แก้ว" type="text"/>
</label>
<label class="flex flex-col gap-1.5 font-label-md text-label-md text-on-surface font-semibold">
รูปสลิป (เก็บใน Google Drive)
<input accept="image/*" class="w-full h-12 rounded-xl bg-surface-container font-label-md text-label-md text-on-surface-variant file:mr-3 file:px-3 file:py-1.5 file:rounded-lg file:border-0 file:bg-primary-container file:text-on-primary-container file:font-semibold" id="in-file" type="file"/>
</label>
</form>
<div class="action-bar grid grid-cols-2 gap-space-xs">
<button class="h-12 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 shadow-lg active:scale-98 transition-transform disabled:opacity-60" form="money-in-form" id="btn-save" type="submit">
<span class="material-symbols-outlined text-[20px]">save</span>
<span>บันทึกเงินเข้า</span>
</button>
<button class="h-12 rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 shadow-lg active:scale-98 transition-transform" id="btn-test-voice" type="button">
<span class="material-symbols-outlined text-[20px]">volume_up</span>
<span>ทดสอบเสียง</span>
</button>
</div>
<p class="font-label-md text-label-md" id="save-status" role="status"></p>
<a class="font-label-md text-label-md text-secondary font-semibold hover:underline" href="index.html">
ไปหน้า "ตรวจสลิป" เพื่อฟังเสียงประกาศยอดเงิน →
</a>
</section>

<div class="h-4"></div>
</div></main>
<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.05)]"><div class="grid grid-cols-2 items-center h-16 px-1"><a aria-current="page" class="flex flex-col items-center justify-center h-12 gap-0.5 transition-colors text-primary font-bold" href="index.html"><svg class="w-[22px] h-[22px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/><path d="m9 12 2 2 4-4"/></svg><span class="font-label-sm text-label-sm text-center">ตรวจสลิป &amp; เงินเข้า</span></a><a class="flex flex-col items-center justify-center h-12 gap-0.5 text-on-surface-variant hover:text-on-surface transition-colors" href="qr.html?v=7"><svg class="w-[22px] h-[22px] shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="3" height="3"/><rect x="18" y="14" width="3" height="3"/><rect x="14" y="18" width="3" height="3"/><rect x="18" y="18" width="3" height="3"/></svg><span class="font-label-sm text-label-sm text-center">QR</span></a></div></nav>
<script src="js/config.js?v=1"></script>
<script src="js/api.js?v=1"></script>
<script>
(function () {
  'use strict';

  // ---- เสียง (สำเนาย่อจากหน้า index) ----
  let audioCtx = null;
  function getAudioContext() {
    try {
      if (!audioCtx) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (C) audioCtx = new C();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { console.warn(e); }
    return audioCtx;
  }
  ['click', 'touchstart', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function () { getAudioContext(); }, { passive: true });
  });
  function playTone(freq, duration, type, gainVal) {
    try {
      const ctx = getAudioContext(); if (!ctx) return;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(gainVal || 0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + duration);
    } catch (e) { console.warn(e); }
  }
  function playHarmonicDingDong() {
    playTone(800, 0.35, 'sine', 0.35);
    setTimeout(function () { playTone(1200, 0.49, 'triangle', 0.38); }, 160);
  }
  function speakThai(text) {
    if ('speechSynthesis' in window) {
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'th-TH'; u.rate = 1.0; u.pitch = 1.05;
        const voices = window.speechSynthesis.getVoices();
        const v = voices.find(function (x) { return x.lang === 'th-TH' || (x.lang || '').startsWith('th') || (x.name || '').toLowerCase().includes('thai'); });
        if (v) u.voice = v;
        window.speechSynthesis.speak(u);
      } catch (e) { console.warn(e); }
    }
  }

  const statusEl = document.getElementById('save-status');
  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.className = 'font-label-md text-label-md ' + (isError ? 'text-error font-bold' : 'text-primary font-semibold');
  }

  // ปุ่มเสียงใน header (เรียกผ่าน onclick)
  window.triggerTestChime = function () {
    getAudioContext();
    playHarmonicDingDong();
    setTimeout(function () { speakThai('ระบบบันทึกเงินเข้าพร้อมใช้งานค่ะ'); }, 260);
    setStatus('ระบบเสียงพร้อมใช้งาน', false);
  };

  // ---- ปุ่มทดสอบเสียง ----
  document.getElementById('btn-test-voice').addEventListener('click', function () {
    getAudioContext();
    playHarmonicDingDong();
    setTimeout(function () {
      speakThai('เงินเข้า 150 บาท');
    }, 300);
    setStatus('ทดสอบเสียงประกาศแล้ว (เสียงจากเครื่อง) ถ้าไม่ได้ยินให้แตะหน้าจอก่อนแล้วลองอีกครั้ง', false);
  });

  // ---- บันทึกเงินเข้า ----
  document.getElementById('money-in-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const amount = parseFloat(document.getElementById('in-amount').value);
    if (!amount || amount <= 0) {
      setStatus('กรุณาระบุยอดเงินที่มากกว่า 0', true);
      return;
    }

    const payload = {
      amount: amount,
      customer: document.getElementById('in-customer').value.trim(),
      bank: document.getElementById('in-bank').value.trim(),
      ref: document.getElementById('in-ref').value.trim(),
      note: document.getElementById('in-note').value.trim(),
      fileName: '',
      fileUrl: ''
    };

    const fileInput = document.getElementById('in-file');
    const file = fileInput && fileInput.files ? fileInput.files[0] : null;

    const btn = document.getElementById('btn-save');
    btn.disabled = true;
    setStatus('กำลังบันทึกลง Google Sheets...', false);

    try {
      getAudioContext();

      if (file) {
        setStatus('กำลังอัปโหลดรูปสลิปขึ้น Google Drive...', false);
        const base64 = await window.Api.fileToBase64(file);
        const uploaded = await window.Api.request('upload', {
          filename: 'slip-' + Date.now() + '-' + (file.name || 'photo.jpg'),
          mimeType: file.type || 'image/jpeg',
          base64: base64
        });
        payload.fileName = uploaded.name;
        payload.fileUrl = uploaded.url;
      }

      const record = await window.Api.request('create', payload);

      playHarmonicDingDong();
      setTimeout(function () {
        speakThai('เงินเข้า ' + (Math.round(amount * 100) / 100) + ' บาท');
      }, 300);
      setStatus('บันทึกเรียบร้อย: +' + amount.toFixed(2) + ' บาท' + (payload.customer ? ' จาก ' + payload.customer : ''), false);

      document.getElementById('money-in-form').reset();
    } catch (err) {
      setStatus('บันทึกไม่สำเร็จ: ' + (err && err.message ? err.message : err), true);
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body></html>
